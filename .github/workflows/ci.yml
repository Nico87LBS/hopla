name: CI

on:
  pull_request:
  push:
    branches: [ "main" ]

jobs:
  version:
    name: Version
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: La version est X.Y.Z et monte à chaque changement
        run: bash scripts/check-version.sh "origin/${{ github.base_ref }}"

  rules:
    name: Règles du projet
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Le titre de la PR et les commits sont en français
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: bash scripts/check-french.sh "origin/${{ github.base_ref }}"
      - name: L'interface web ne parle pas de Home Assistant
        run: bash scripts/check-no-home-assistant.sh

  server:
    name: Server tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Le code Go est mis en forme (gofmt)
        run: |
          unformatted=$(gofmt -l . | grep -v '^web/' || true)
          if [ -n "$unformatted" ]; then echo "$unformatted"; echo "::error::Ces fichiers ne sont pas formatés : lance gofmt -w dessus."; exit 1; fi
      - name: Check time.Now().UTC() usage
        run: bash scripts/check-time-utc.sh
      - name: Swagger description is up to date
        run: bash scripts/check-swagger.sh
      - run: go vet ./...
      - run: go test ./...

  web:
    name: Web app build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx eslint --quiet src
      - run: npm run lint:i18n
      - run: node --test tests/*.test.mjs
      - run: npx vite build --mode selfhosted
