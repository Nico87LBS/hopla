securityDefinitions:
  APIKeyAuth:
    description: Jeton d'accès longue durée créé dans les réglages du compte.
    in: header
    name: secretkey
    type: apiKey
  JWTKeyAuth:
    description: « Bearer » suivi d'une espace et du jeton de connexion.
    in: header
    name: Authorization
    type: apiKey
  PlayKeyAuth:
    description: Session « jeux seulement » ouverte par un lien de jeu.
    in: header
    name: X-Hopla-Play
    type: apiKey
