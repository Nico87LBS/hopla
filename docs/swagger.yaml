      description: Returns chores and chore histories that have changed since the
        given sync version cursor, along with deleted entity IDs. Paginated — call
        repeatedly while hasMore is true using the returned cursor.
      parameters:
      - default: 0
        description: Sync version cursor (0 for initial full sync)
        format: int64
        in: query
        name: since
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: changes, deletions, cursor, hasMore
          schema:
            additionalProperties: true
            type: object
