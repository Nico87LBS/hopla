definitions:
  chore.ActionOptions:
    properties:
      createdAt:
        type: string
      nextDueDate:
        type: string
      syncVersion:
        type: integer
    type: object
  chore.AssigneeReq:
    properties:
      assignee:
        type: integer
      updatedAt:
        type: string
    required:
    - assignee
    - updatedAt
    type: object
  chore.CatchUpSlotReq:
    properties:
      completedBy:
        type: integer
    type: object
  chore.ChoreReq:
    properties:
      assignStrategy:
        allOf:
        - $ref: '#/definitions/model.AssignmentStrategy'
        enum:
        - no_assignee
        - least_assigned
        - least_completed
        - random
        - keep_last_assigned
        - random_except_last_assigned
        - round_robin
        - together
      assignedTo:
        type: integer
      assignees:
        items:
          $ref: '#/definitions/model.ChoreAssignees'
        type: array
      completionWindow:
        type: integer
      description:
        type: string
      draftId:
        type: string
      flashMinutes:
        maximum: 720
        minimum: 1
        type: integer
      flashPoints:
        maximum: 1000
        minimum: 0
        type: integer
      frequency:
        type: integer
      frequencyMetadata:
        $ref: '#/definitions/model.FrequencyMetadata'
      frequencyType:
        allOf:
        - $ref: '#/definitions/model.FrequencyType'
        enum:
        - once
        - daily
        - weekly
        - monthly
        - yearly
        - adaptive
        - interval
        - days_of_the_week
        - day_of_the_month
        - trigger
        - no_repeat
        - always
      id:
        type: integer
      isActive:
        type: boolean
      isPrivate:
        type: boolean
      isRolling:
        type: boolean
      labelsV2:
        items:
          $ref: '#/definitions/model.LabelReq'
        type: array
        uniqueItems: true
      name:
        type: string
      nextDueDate:
        description: Next due date in RFC3339 format
        type: string
      notification:
        type: boolean
      notificationMetadata:
        $ref: '#/definitions/model.NotificationMetadata'
      points:
        type: integer
      priority:
        type: integer
      requireApproval:
        type: boolean
      subTasks:
        items:
          $ref: '#/definitions/model.SubTask'
        type: array
      updatedAt:
        type: string
    required:
    - assignStrategy
    - frequencyType
    - name
    type: object
  chore.CompleteChoreReq:
    properties:
      actionOptions:
        $ref: '#/definitions/chore.ActionOptions'
      completedBy:
        description: The completed by only can be populated by the admin or super
          user.
        type: integer
      completedTime:
        description: Completion date in RFC3339 format (defaults to now).
        type: string
      note:
        description: This is going to be deprecated in future release, use "Notes"
          instead.
        minLength: 1
        type: string
      notes:
        minLength: 1
        type: string
    type: object
  chore.DueDateReq:
    properties:
      dueDate:
        type: string
      updatedAt:
        type: string
    required:
    - updatedAt
    type: object
  chore.FamilyTimezone:
    properties:
      custom:
        description: Custom is true when the family is not in the server's zone.
        type: boolean
      server:
        description: Server is the server's zone, the family's when it is at home.
        type: string
      timezone:
        description: Timezone is the zone every date of the family follows.
        type: string
    type: object
  chore.ModifyHistoryReq:
    properties:
      dueDate:
        type: string
      notes:
        type: string
      performedAt:
        type: string
    type: object
  chore.RejectChoreReq:
    properties:
      actionOptions:
        $ref: '#/definitions/chore.ActionOptions'
      note:
        description: This is going to be deprecated in future release, use "Notes"
          instead.
        minLength: 1
        type: string
      notes:
        minLength: 1
        type: string
    type: object
  chore.SubtaskReq:
    properties:
      choreId:
        type: integer
      completedAt:
        type: string
      id:
        type: integer
    type: object
  family.Family:
    properties:
      created_at:
        description: Created at
        type: string
      created_by:
        description: Created by
        type: integer
      currency:
        description: Currency names what the family earns, one of Currencies.
        type: string
      disabled:
        description: Disabled
        type: boolean
      id:
        description: Unique identifier
        type: integer
      invite_code:
        description: Invite code
        type: string
      name:
        description: Full name
        type: string
      parentsOnPodium:
        description: |-
          ParentsOnPodium puts the parents on the podium with the children.
          Without children, the parents are always on it.
        type: boolean
      timezone:
        description: |-
          Timezone is the family's IANA zone, empty for the server's (TZ). See
          package zone.
        type: string
      updated_at:
        description: Updated at
        type: string
    type: object
  family.Role:
    enum:
    - admin
    - member
    - manager
    type: string
    x-enum-varnames:
    - RoleAdmin
    - RoleMember
    - RoleManager
  family.UserFamilyDetail:
    properties:
      away:
        description: |-
          Away pauses the member's tasks and games, such as a child staying at
          the other parent's home.
        type: boolean
      createdAt:
        description: Created at
        type: string
      displayName:
        type: string
      familyId:
        description: Family ID
        type: integer
      id:
        description: Unique identifier
        type: integer
      image:
        description: Image
        type: string
      isActive:
        type: boolean
      points:
        description: Points
        type: integer
      pointsRedeemed:
        description: Points Redeemed
        type: integer
      role:
        allOf:
        - $ref: '#/definitions/family.UserRole'
        description: Role
      updatedAt:
        description: Updated at
        type: string
      userId:
        description: User ID
        type: integer
      username:
        type: string
    type: object
  family.UserRole:
    enum:
    - admin
    - member
    - manager
    type: string
    x-enum-varnames:
    - UserRoleAdmin
    - UserRoleMember
    - UserRoleManager
  github_com_nico87lbs_hopla_internal_storage_model.EntityType:
    enum:
    - 0
    - 1
    - 2
    - 3
    - 4
    - 5
    - 6
    type: integer
    x-enum-comments:
      _: was used by objects (Things), now removed; the values are stored, so the
        slot stays
    x-enum-descriptions:
    - ""
    - ""
    - ""
    - was used by objects (Things), now removed; the values are stored, so the slot
      stays
    - ""
    - ""
    - ""
    x-enum-varnames:
    - EntityTypeUnknown
    - EntityTypeChoreDescription
    - EntityTypeChoreHistory
    - _
    - EntityTypeChoreAttachment
    - EntityTypeChoreAttachmentDraft
    - EntityTypeChoreDescriptionDraft
  model.AssignmentStrategy:
    enum:
    - random
    - least_assigned
    - least_completed
    - keep_last_assigned
    - random_except_last_assigned
    - round_robin
    - no_assignee
    - together
    type: string
    x-enum-varnames:
    - AssignmentStrategyRandom
    - AssignmentStrategyLeastAssigned
    - AssignmentStrategyLeastCompleted
    - AssignmentStrategyKeepLastAssigned
    - AssignmentStrategyRandomExceptLastAssigned
    - AssignmentStrategyRoundRobin
    - AssignmentStrategyNoAssignee
    - AssignmentStrategyTogether
  model.Chore:
    properties:
      assignStrategy:
        allOf:
        - $ref: '#/definitions/model.AssignmentStrategy'
        description: How the chore is assigned
      assignedTo:
        description: Who the chore is assigned to
        type: integer
      assignees:
        description: Assignees of the chore
        items:
          $ref: '#/definitions/model.ChoreAssignees'
        type: array
      attachments:
        items:
          $ref: '#/definitions/model.StorageFile'
        type: array
      completionWindow:
        description: Number seconds before the chore is due that it can be completed
        type: integer
      createdAt:
        description: When the chore was created
        type: string
      createdBy:
        description: Who created the chore
        type: integer
      description:
        description: Description of the chore
        type: string
      familyId:
        description: The family this chore is in
        type: integer
      flash:
        allOf:
        - $ref: '#/definitions/model.FlashWindow'
        description: The flash bonus open now, if any
      flashMinutes:
        description: 'Flash bonus: minutes after the due time it stays open'
        type: integer
      flashPoints:
        description: 'Flash bonus: extra points when done in time'
        type: integer
      frequency:
        description: Number of days, weeks, months, or years between chores
        type: integer
      frequencyMetadata:
        allOf:
        - $ref: '#/definitions/model.FrequencyMetadata'
        description: Additional frequency information for v2 (if used)
      frequencyType:
        allOf:
        - $ref: '#/definitions/model.FrequencyType'
        description: '"daily", "weekly", "monthly", "yearly", "adaptive",or "custom"'
      id:
        type: integer
      isActive:
        description: Whether the chore is active
        type: boolean
      isPrivate:
        description: Whether the chore is private
        type: boolean
      isRolling:
        description: Whether the chore is rolling
        type: boolean
      labelsV2:
        description: Labels for the chore
        items:
          $ref: '#/definitions/model.Label'
        type: array
      name:
        description: Chore description
        type: string
      nextDueDate:
        description: When the chore is due
        type: string
      notification:
        description: Whether the chore has notification
        type: boolean
      notificationMetadata:
        allOf:
        - $ref: '#/definitions/model.NotificationMetadata'
        description: Additional notification information
      points:
        description: Points for completing the chore
        type: integer
      priority:
        type: integer
      requireApproval:
        description: Whether chore completion requires admin approval
        type: boolean
      slotsToday:
        description: Today's slots of a task done several times a day
        items:
          $ref: '#/definitions/model.SlotStatus'
        type: array
      status:
        $ref: '#/definitions/model.Status'
      subTasks:
        description: Subtasks for the chore
        items:
          $ref: '#/definitions/model.SubTask'
        type: array
      syncVersion:
        type: integer
      updatedAt:
        description: When the chore was last updated
        type: string
      updatedBy:
        description: Who last updated the chore
        type: integer
    type: object
  model.ChoreAssignees:
    properties:
      userId:
        description: The user this assignee is for
        type: integer
    type: object
  model.ChoreHistory:
    properties:
      assignedTo:
        description: Who the chore was assigned to
        type: integer
      choreId:
        description: The chore this history is for
        type: integer
      completedBy:
        description: Who completed the chore
        type: integer
      createdAt:
        description: When the record was created (immutable after insert)
        type: string
      dueDate:
        description: When the chore was due
        type: string
      duration:
        description: Duration in seconds calculated from query (read-only, no DB column)
        type: integer
      flashId:
        description: The flash launched by a parent this completion won
        type: integer
      id:
        description: Unique identifier
        type: integer
      notes:
        description: Notes about the chore
        type: string
      performedAt:
        description: When the chore was performed (completed or skipped)
        type: string
      points:
        description: Points for completing the chore
        type: integer
      slot:
        description: The slot of the day, for a task done several times a day
        type: integer
      status:
        allOf:
        - $ref: '#/definitions/model.ChoreHistoryStatus'
        description: Status of the chore (1=completed, 2=skipped)
      syncVersion:
        type: integer
      updatedAt:
        description: When the record was last updated
        type: string
    type: object
  model.ChoreHistoryStatus:
    enum:
    - 0
    - 1
    - 2
    - 3
    - 4
    - 5
    - 6
    format: int32
    type: integer
    x-enum-varnames:
    - ChoreHistoryStatusStarted
    - ChoreHistoryStatusCompleted
    - ChoreHistoryStatusSkipped
    - ChoreHistoryStatusPendingApproval
    - ChoreHistoryStatusRejected
    - ChoreHistoryStatusMissed
    - ChoreHistoryStatusRescheduled
  model.FlashWindow:
    properties:
      endsAt:
        type: string
      liveId:
        type: integer
      points:
        type: integer
    type: object
  model.FrequencyMetadata:
    properties:
      days:
        items:
          type: string
        type: array
      months:
        items:
          type: string
        type: array
      occurrences:
        description: e.g. ["1","3","last"] for 1st, 3rd, and last occurrence of the
          day
        items:
          type: integer
        type: array
      slots:
        description: Times of day a daily task is done at, each one on its own
        items:
          $ref: '#/definitions/model.Slot'
        type: array
      time:
        type: string
      timezone:
        type: string
      unit:
        enum:
        - hours
        - days
        - weeks
        - months
        - years
        type: string
      weekNumbers:
        description: 'DEPRECATED: use Occurrences instead'
        items:
          type: integer
        type: array
      weekPattern:
        allOf:
        - $ref: '#/definitions/model.Weekpattern'
        enum:
        - every_week
        - week_of_month
        - week_of_quarter
    type: object
  model.FrequencyType:
    enum:
    - once
    - daily
    - weekly
    - monthly
    - yearly
    - adaptive
    - interval
    - days_of_the_week
    - day_of_the_month
    - trigger
    - no_repeat
    - always
    type: string
    x-enum-varnames:
    - FrequencyTypeOnce
    - FrequencyTypeDaily
    - FrequencyTypeWeekly
    - FrequencyTypeMonthly
    - FrequencyTypeYearly
    - FrequencyTypeAdaptive
    - FrequencyTypeInterval
    - FrequencyTypeDayOfTheWeek
    - FrequencyTypeDayOfTheMonth
    - FrequencyTypeTrigger
    - FrequencyTypeNoRepeat
    - FrequencyTypeAlways
  model.Label:
    properties:
      color:
        type: string
      created_by:
        type: integer
      id:
        type: integer
      name:
        type: string
    type: object
  model.LabelReq:
    properties:
      id:
        type: integer
    required:
    - id
    type: object
  model.NotificationMetadata:
    properties:
      completion:
        type: boolean
      dueDate:
        type: boolean
      nagging:
        type: boolean
      predue:
        type: boolean
      templates:
        description: Template for notification
        items:
          $ref: '#/definitions/model.NotificationTemplate'
        maxItems: 5
        type: array
    type: object
  model.NotificationTemplate:
    properties:
      unit:
        $ref: '#/definitions/model.NotificationTemplateUnit'
      value:
        type: integer
    type: object
  model.NotificationTemplateUnit:
    enum:
    - m
    - h
    - d
    type: string
    x-enum-varnames:
    - NotificationTemplateUnitMinute
    - NotificationTemplateUnitHour
    - NotificationTemplateUnitDay
  model.Slot:
    properties:
      name:
        type: string
      time:
        description: '"15:04", in the task''s timezone'
        type: string
    type: object
  model.SlotState:
    enum:
    - upcoming
    - open
    - pending
    - done
    - missed
    type: string
    x-enum-comments:
      SlotMissed: closed without being done; a parent can still catch it up today
      SlotOpen: can be ticked now
      SlotPending: ticked, waiting for a parent
      SlotUpcoming: not open yet
    x-enum-descriptions:
    - not open yet
    - can be ticked now
    - ticked, waiting for a parent
    - ""
    - closed without being done; a parent can still catch it up today
    x-enum-varnames:
    - SlotUpcoming
    - SlotOpen
    - SlotPending
    - SlotDone
    - SlotMissed
  model.SlotStatus:
    properties:
      at:
        type: string
      closesAt:
        type: string
      completedBy:
        type: integer
      historyId:
        type: integer
      index:
        type: integer
      name:
        type: string
      opensAt:
        type: string
      state:
        $ref: '#/definitions/model.SlotState'
      time:
        type: string
    type: object
  model.Status:
    enum:
    - 0
    - 1
    - 2
    - 3
    format: int32
    type: integer
    x-enum-varnames:
    - ChoreStatusNoStatus
    - ChoreStatusInProgress
    - ChoreStatusPaused
    - ChoreStatusPendingApproval
  model.StorageFile:
    properties:
      created_at:
        type: integer
      draft_id:
        type: string
      entity_id:
        type: integer
      entity_type:
        $ref: '#/definitions/github_com_nico87lbs_hopla_internal_storage_model.EntityType'
      file_name:
        type: string
      file_path:
        type: string
      sign:
        description: Sign is a fetchable (signed) URL populated at serialization time;
          never stored.
        type: string
      size_bytes:
        type: integer
      user_id:
        type: integer
    type: object
  model.SubTask:
    properties:
      completedAt:
        type: string
      completedBy:
        type: integer
      id:
        type: integer
      name:
        type: string
      orderId:
        type: integer
      parentId:
        type: integer
    type: object
  model.Weekpattern:
    enum:
    - every_week
    - week_of_month
    - week_of_quarter
    type: string
    x-enum-comments:
      WeekPatternWeekOfMonth: e.g. ["1","3","last"] for 1st, 3rd, and last occurrence
        of the day in the month
      WeekPatternWeekOfQuarter: e.g. ["1","2","3"] for 1st, 2nd, and 3rd occurrence
        of the day in the quarter
    x-enum-descriptions:
    - ""
    - e.g. ["1","3","last"] for 1st, 3rd, and last occurrence of the day in the month
    - e.g. ["1","2","3"] for 1st, 2nd, and 3rd occurrence of the day in the quarter
    x-enum-varnames:
    - WeekpatternEveryWeek
    - WeekPatternWeekOfMonth
    - WeekPatternWeekOfQuarter
info:
  contact: {}
paths:
  /chores:
    get:
      consumes:
      - application/json
      description: Retrieves all chores for the current user's family with optional
        archived chores
      parameters:
      - description: Include archived chores
        in: query
        name: includeArchived
        type: boolean
      - description: Include subtasks for chore
        in: query
        name: includeSubtasks
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: 'res: array of chores'
          schema:
            additionalProperties:
              items:
                $ref: '#/definitions/model.Chore'
              type: array
            type: object
        "401":
          description: 'error: Authentication failed'
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: 'error: Failed to retrieve chores'
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - JWTKeyAuth: []
      - APIKeyAuth: []
      summary: Get all chores
      tags:
      - chores
    post:
      consumes:
      - application/json
      description: Creates a new chore with assignees, labels, and optional configurations
      parameters:
      - description: Chore creation request
        in: body
        name: chore
        required: true
        schema:
          $ref: '#/definitions/chore.ChoreReq'
      produces:
      - application/json
      responses:
        "200":
          description: 'res: created chore ID'
          schema:
            additionalProperties:
              type: integer
            type: object
        "400":
          description: 'error: Invalid request format | Assignee not found in family
            | Invalid date'
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: 'error: Authentication failed'
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: 'error: Failed to create chore | Error adding labels | Error
            adding chore assignees'
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - JWTKeyAuth: []
      - APIKeyAuth: []
      summary: Create a new chore
      tags:
      - chores
    put:
      consumes:
      - application/json
      description: Updates chore details including assignees, labels, subtasks, and
        metadata
      parameters:
      - description: Chore update request
        in: body
        name: chore
        required: true
        schema:
          $ref: '#/definitions/chore.ChoreReq'
      produces:
      - application/json
      responses:
        "200":
          description: 'message: Chore updated successfully'
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: 'error: Invalid request format | Invalid date | Assignee not
            found in family | Assigned to not found in assignees'
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: 'error: Authentication failed'
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: 'error: You cannot edit this chore'
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: 'error: Failed to retrieve chore | Error adding chore | Error
            adding subtasks'
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - JWTKeyAuth: []
      - APIKeyAuth: []
      summary: Edit an existing chore
      tags:
      - chores
  /chores/{id}:
    delete:
      consumes:
      - application/json
      description: Deletes a chore and associated notifications (owner only)
      parameters:
      - description: Chore ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 'message: Chore deleted successfully'
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: 'error: Invalid ID'
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: 'error: Authentication failed'
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: 'error: You are not allowed to delete this chore'
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: 'error: Failed to retrieve chore | Failed to delete chore'
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - JWTKeyAuth: []
      - APIKeyAuth: []
      summary: Delete a chore
      tags:
      - chores
    get:
      consumes:
      - application/json
      description: Retrieves detailed information about a specific chore by ID
      parameters:
      - description: Chore ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 'res: chore object'
          schema:
            additionalProperties:
              $ref: '#/definitions/model.Chore'
            type: object
        "400":
          description: 'error: Invalid chore ID'
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: 'error: Authentication failed'
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: 'error: You are not allowed to view this chore'
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: 'error: Failed to retrieve chore'
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - JWTKeyAuth: []
      - APIKeyAuth: []
      summary: Get a specific chore
      tags:
      - chores
  /chores/{id}/approve:
    post:
      consumes:
      - application/json
      description: Approves a pending chore completion (admin/manager only)
      parameters:
      - description: Chore ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 'res: updated chore'
          schema:
            additionalProperties:
              $ref: '#/definitions/model.Chore'
            type: object
        "400":
          description: 'error: Invalid ID | Chore is not pending approval'
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: 'error: Authentication failed'
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: 'error: Only admins can approve chores'
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: 'error: Failed to retrieve chore | Error approving chore'
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - JWTKeyAuth: []
      - APIKeyAuth: []
      summary: Approve a chore completion
      tags:
      - chores
  /chores/{id}/archive:
    put:
      consumes:
