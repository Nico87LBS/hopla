<!DOCTYPE html>
<html lang="{{.Lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Subject}}</title>
</head>
<body style="margin:0;padding:0;background:#f4f1ea;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#2b2a28;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f1ea;">
<tr><td align="center" style="padding:32px 16px;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#ffffff;border-radius:16px;">
<tr><td style="padding:32px 28px;">
<p style="margin:0 0 8px;font-size:15px;font-weight:700;color:#e8743b;">Hopla</p>
<h1 style="margin:0 0 16px;font-size:24px;line-height:1.3;">{{.Title}}</h1>
<p style="margin:0 0 24px;font-size:16px;line-height:1.5;">{{.Body}}</p>
<p style="margin:0 0 24px;"><a href="{{.URL}}" style="display:inline-block;padding:12px 22px;border-radius:999px;background:#e8743b;color:#ffffff;font-weight:700;text-decoration:none;">{{.Button}}</a></p>
<p style="margin:0;font-size:13px;line-height:1.5;color:#77736b;">{{.Ignore}}</p>
</td></tr>
</table>
</td></tr>
</table>
</body>
</html>
